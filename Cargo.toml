[package]
name = "agentlens"
version = "0.1.0"
edition = "2024"
description = "Local skill invocation collection and reporting"
license = "MIT"

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5.46", features = ["derive"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
uuid = { version = "1.18.0", features = ["serde", "v7"] }
